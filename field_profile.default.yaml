# input 可选：指定 Excel/TSV 输入文件；Excel 可用 sheets 指定要读取并合并的工作表。
# path 为相对路径时，相对于本 YAML 文件所在目录。
input:
  path: data/input/0706.xlsx
  sheets:
    - ALL尺码匹配表
    - TM尺码匹配表
    - HNT尺码匹配表

# 左边是脚本内部使用的标准字段名；右边是输入文件里允许出现的列名。
# 如果标准字段已经存在，会优先使用标准字段；否则按右侧候选列名从前到后查找。
columns:
  品牌:
    - MAKE
  前台车型:
    - MODEL
  结构:
    - 结构
  版本:
    - 版本
  年份区间:
    - YEAR
  最终尺码:
    - 确认尺码
    - 自动尺码
  驾驶室类型:
    - CAB
  货斗长度_ft:
    - BED
  子车系:
    - SUB-MODEL
  分类:
    - 分类

defaults:
  # 分类为空时，脚本会退回用 驾驶室类型 / 货斗长度_ft 判断是否皮卡。
  分类: ""
